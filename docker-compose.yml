version: '3.8'

services:
  db:
    image: postgres:15
    container_name: logitrack-db
    restart: always
    environment:
      POSTGRES_USER: logi_user
      POSTGRES_PASSWORD: logi_password
      POSTGRES_DB: logitrack_db
    ports:
      - '5444:5432'
    volumes:
      - ./Back-end/init.sql:/docker-entrypoint-initdb.d/init.sql
      - logitrack_data:/var/lib/postgresql/data
    networks:
      - logitrack_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logi_user -d logitrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: logitrack-backend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logitrack_db
      SPRING_DATASOURCE_USERNAME: logi_user
      SPRING_DATASOURCE_PASSWORD: logi_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: u2UBiKSz4stj908qc1oxXWmFeLdUIKclacFYPpN6IXvtKRoknYYH9t8EQLfUvaIhNPUDYOPK
      JWT_EXPIRATION: 3600000
    volumes:
      - ./Back-end:/app
      - /app/target
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logitrack_network

  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
    container_name: logitrack-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - logitrack_network

networks:
  logitrack_network:
    driver: bridge

volumes:
  logitrack_data:
    driver: local
